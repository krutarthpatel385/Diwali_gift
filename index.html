<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Diwali!</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000000;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Video container */

.video-container {
    width: 90%;
    max-width: 750px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
}

video {
    width: 100%;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 12px;
}

/* Fireworks canvas */

#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
}

/* Night Black Fireworks Button */

.firework-btn {
    position: fixed;
    bottom: 25px;
    right: 20px;
    z-index: 10;

    background: #080808;
    color: #ffffff;

    border: 1px solid #333333;
    border-radius: 50px;

    padding: 14px 20px;
    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 15px rgba(255, 255, 255, 0.12);

    transition: all 0.3s ease;
}

.firework-btn:hover {
    background: #151515;
    border-color: #777777;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
    transform: scale(1.08);
}

.firework-btn:active {
    transform: scale(0.95);
}

/* Mobile adjustments */

@media (max-width: 600px) {

    .video-container {
        width: 95%;
    }

    video {
        max-height: 75vh;
    }

    .firework-btn {
        bottom: 20px;
        right: 15px;
        padding: 12px 17px;
        font-size: 14px;
    }

}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<!-- Centre Video -->

<div class="video-container">

    <video controls autoplay muted playsinline>
        <source src="Jethalal Sings Happy Diwali _ Dialogue With Beats _ Heppy Diwali _ 2020 _ #AKSHAYEDITING.mp4" type="video/mp4">
        Your browser does not support video playback.
    </video>

</div>

<!-- More Fireworks Button -->

<button class="firework-btn" onclick="launchFireworks(3)">
    🎆
</button>


<script>

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let rockets = [];
let particles = [];


// Canvas sizing

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


// Create rocket

function createRocket() {

    rockets.push({

        x: Math.random() * canvas.width,
        y: canvas.height,

        targetY: canvas.height * (0.15 + Math.random() * 0.4),

        speed: 6 + Math.random() * 3,

        hue: Math.random() * 360

    });

}


// Explosion particles

function explode(x, y, hue) {

    const count = 100;

    for (let i = 0; i < count; i++) {

        const angle = Math.random() * Math.PI * 2;

        const speed = Math.random() * 5 + 1;

        particles.push({

            x: x,
            y: y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            alpha: 1,

            hue: hue + Math.random() * 50,

            size: Math.random() * 2.5 + 1

        });

    }

}


// Launch multiple fireworks

function launchFireworks(number = 3) {

    for (let i = 0; i < number; i++) {

        setTimeout(() => {

            createRocket();

        }, i * 650);

    }

}


// Main animation loop

function animate() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);


    // Rocket animation

    rockets.forEach((rocket, index) => {

        rocket.y -= rocket.speed;

        ctx.beginPath();

        ctx.arc(rocket.x, rocket.y, 3, 0, Math.PI * 2);

        ctx.fillStyle = `hsl(${rocket.hue},100%,70%)`;

        ctx.fill();


        // Rocket explosion

        if (rocket.y <= rocket.targetY) {

            explode(rocket.x, rocket.y, rocket.hue);

            rockets.splice(index, 1);

        }

    });


    // Particle animation

    particles.forEach((particle, index) => {

        particle.x += particle.vx;
        particle.y += particle.vy;

        particle.vy += 0.035;

        particle.vx *= 0.99;
        particle.vy *= 0.99;

        particle.alpha -= 0.012;


        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${particle.hue},100%,65%,${particle.alpha})`;

        ctx.fill();


        // Remove faded particles

        if (particle.alpha <= 0) {

            particles.splice(index, 1);

        }

    });


    requestAnimationFrame(animate);

}


// Start animation

animate();


// Initial three fireworks (once on page load)

window.addEventListener("load", () => {

    setTimeout(() => {

        launchFireworks(3);

    }, 500);

});

</script>

</body>
</html>
